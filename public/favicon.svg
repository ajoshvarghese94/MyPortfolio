<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfc48e" />
      <stop offset="50%" stop-color="#c9a96b" />
      <stop offset="100%" stop-color="#96773e" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419" />
      <stop offset="100%" stop-color="#070709" />
    </linearGradient>
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg-grad)" stroke="url(#gold-grad)" stroke-width="1.5" />
  <!-- Monogram AV -->
  <g fill="none" stroke="url(#gold-grad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#subtle-shadow)">
    <!-- Letter A -->
    <path d="M19 44 L27 20 L35 44" />
    <path d="M22.5 35.5 L31.5 35.5" />
    <!-- Letter V -->
    <path d="M33 20 L41 44 L49 20" />
  </g>
  <!-- Subtle accent dot -->
  <circle cx="49" cy="44" r="1.75" fill="url(#gold-grad)" />
</svg>
